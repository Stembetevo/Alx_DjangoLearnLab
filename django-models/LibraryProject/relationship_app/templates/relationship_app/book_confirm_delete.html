{% load static %}
<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Delete Book</title>
  <link rel="stylesheet" href="{% static 'relationship_app/style.css' %}">
</head>
<body>
  <h1>Delete Book</h1>
  <p>Are you sure you want to delete "{{ book.title }}"?</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit">Yes, delete</button>
    <a href="{% url 'book-list' %}">Cancel</a>
  </form>
</body>
</html>
