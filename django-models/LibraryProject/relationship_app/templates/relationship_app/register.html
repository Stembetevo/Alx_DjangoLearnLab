<!-- registration.html -->
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register</title>
    <link rel="stylesheet" href="{%static 'relationship_app/style.css' %}">
</head>
<body class="page-auth">
    <div class="auth-container">
        <h1>Register</h1>
        <form method="post" class="auth-form">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn">Register</button>
        </form>
        <p class="muted">Already have an account? <a href="{% url 'login' %}">Login</a></p>
    </div>
</body>
</html>
