{% load static %}
<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Book form</title>
</head>
<body>
  <h1>{% if book %}Edit{% else %}Create{% endif %} Book</h1>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Save</button>
  </form>
  <a href="{% url 'bookshelf:list_books' %}">Back to list</a>
</body>
</html>
