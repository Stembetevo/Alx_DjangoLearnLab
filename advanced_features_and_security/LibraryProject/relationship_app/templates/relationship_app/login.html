<!-- login.html -->
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link rel="stylesheet" href="{% static 'relationship_app/style.css' %}">
</head>
<body class="page-auth">
    <div class="auth-container">
        <h1>Login</h1>
        <form method="post" class="auth-form">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn">Login</button>
        </form>
        <p class="muted">Don't have an account? <a href="{% url 'register' %}">Register</a></p>
    </div>
</body>
</html>
